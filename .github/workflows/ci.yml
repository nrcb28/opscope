name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build
        run: dotnet build src/Opscope/Opscope.csproj -c Release --nologo
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash tests/smoke.sh
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke.ps1


