name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build CLI and modules
        run: dotnet build src/Opscope/Opscope.csproj -c Release --nologo
      - name: Exercise real CLI exports and loopback features
        run: python tests/cli_smoke.py
      - name: Run every .NET regression project
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            Write-Host "Running $($project.Name)"
            dotnet run --project $project.FullName -c Release --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash tests/smoke.sh
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Validate release asset tooling without publishing
        run: python -m unittest discover -s packaging -p 'test_*.py'

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Opscope.ApiTests/package-lock.json
      - name: Build isolated local fixture host
        run: dotnet build tests/Opscope.ApiTests/Opscope.ApiTests.csproj --nologo
      - name: Install locked browser test dependencies
        working-directory: tests/Opscope.ApiTests
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        working-directory: tests/Opscope.ApiTests
        run: npx playwright install --with-deps chromium
      - name: Exercise local UI, privacy, downloads, and accessibility
        working-directory: tests/Opscope.ApiTests
        run: npm test

  distribution-version:
    needs: [build, browser]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: version
        env:
          CANDIDATE_SUFFIX: ci.${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(python3 packaging/release_assets.py candidate-version --project src/Opscope/Opscope.csproj --suffix "$CANDIDATE_SUFFIX")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  distribution:
    needs: distribution-version
    uses: ./.github/workflows/package-build.yml
    with:
      version: ${{ needs.distribution-version.outputs.version }}
      run_regressions: false
      native_signing: false
