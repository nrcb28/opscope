name: package-build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      run_regressions:
        description: 'Run source regression projects when the caller has not already checked them'
        required: false
        default: true
        type: boolean
      native_signing:
        description: 'Enable optional native certificates supplied explicitly by the release caller'
        required: false
        default: false
        type: boolean
    secrets:
      OPSCOPE_WINDOWS_CERTIFICATE_BASE64:
        required: false
      OPSCOPE_WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      OPSCOPE_MACOS_CERTIFICATE_BASE64:
        required: false
      OPSCOPE_MACOS_CERTIFICATE_PASSWORD:
        required: false
      OPSCOPE_MACOS_SIGN_IDENTITY:
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the literal package version
        run: python3 -c "import os,sys; sys.path.insert(0, 'packaging'); import release_assets; release_assets.validate_version(os.environ['RELEASE_VERSION'])"

  binaries:
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: osx-x64, os: macos-14 }
          - { rid: osx-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Publish self-contained binary
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          "SOURCE_DATE_EPOCH=$env:SOURCE_DATE_EPOCH" >> $env:GITHUB_ENV
          dotnet publish src/Opscope/Opscope.csproj -c Release -r $env:RELEASE_RID --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$env:RELEASE_VERSION" -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          Copy-Item LICENSE,README.md publish/
      - name: Record unsigned candidate packaging
        if: inputs.native_signing == false
        run: Write-Output 'Candidate packaging does not request native signing or use signing credentials.'
      - name: Sign Windows binary when a real certificate is configured
        if: inputs.native_signing && runner.os == 'Windows'
        env:
          CERTIFICATE_BASE64: ${{ secrets.OPSCOPE_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.OPSCOPE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { Write-Output 'Authenticode signing skipped: no certificate configured.'; exit 0 }
          $certificateFile = Join-Path $env:RUNNER_TEMP 'opscope-signing.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = if ($env:CERTIFICATE_PASSWORD) { ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force } else { New-Object Security.SecureString }
            $certificate = Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'Configured certificate contains no private key.' }
            $signature = Set-AuthenticodeSignature -FilePath publish/opscope.exe -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer https://timestamp.digicert.com
            if ($signature.Status -ne 'Valid') { throw 'Authenticode validation failed.' }
          } finally {
            Remove-Item $certificateFile -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }
      - name: Sign macOS binary when a real Developer ID is configured
        if: inputs.native_signing && runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.OPSCOPE_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.OPSCOPE_MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.OPSCOPE_MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" ]]; then echo 'Developer ID signing skipped: no certificate configured.'; exit 0; fi
          test -n "$SIGN_IDENTITY"
          umask 077
          keychain="$RUNNER_TEMP/opscope-signing.keychain-db"
          certificate="$RUNNER_TEMP/opscope-signing.p12"
          keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          python3 -c 'import os,base64; from pathlib import Path; Path(os.environ["RUNNER_TEMP"],"opscope-signing.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_BASE64"],validate=True))'
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          find publish -name '*.dylib' -exec codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$SIGN_IDENTITY" '{}' \;
          codesign --force --options runtime --timestamp --entitlements packaging/macos-entitlements.plist --keychain "$keychain" --sign "$SIGN_IDENTITY" publish/opscope
          codesign --verify --strict publish/opscope
      - name: Create archive and SPDX SBOM from actual output
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $extension = if ($env:RELEASE_RID.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          $name = "opscope-$env:RELEASE_VERSION-$env:RELEASE_RID"
          python packaging/release_assets.py archive --input publish --output "dist/$name.$extension"
          if ($LASTEXITCODE -ne 0) { throw 'Archive generation failed.' }
          python packaging/release_assets.py sbom --input publish --output "dist/$name.spdx.json" --version $env:RELEASE_VERSION --rid $env:RELEASE_RID --assets src/Opscope/obj/project.assets.json
          if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed.' }
          python packaging/release_assets.py verify-archive --input "dist/$name.$extension" --sbom "dist/$name.spdx.json" --version $env:RELEASE_VERSION --rid $env:RELEASE_RID
          if ($LASTEXITCODE -ne 0) { throw 'Archive integrity validation failed.' }
      - name: Install the extracted archive and exercise the matching native architecture
        run: |
          $hostArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $targetArchitecture = $env:RELEASE_RID.Split('-')[-1]
          if ($hostArchitecture -ne $targetArchitecture) {
            Write-Output "Cross-built $env:RELEASE_RID on $hostArchitecture; native execution was not performed for this archive."
            "- $($env:RELEASE_RID): archive integrity passed; native execution skipped on $hostArchitecture." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $destination = Join-Path $env:RUNNER_TEMP "opscope-native-$env:RELEASE_RID"
          New-Item -ItemType Directory $destination | Out-Null
          $name = "opscope-$env:RELEASE_VERSION-$env:RELEASE_RID"
          if ($env:RELEASE_RID.StartsWith('win-')) {
            Expand-Archive -LiteralPath "dist/$name.zip" -DestinationPath $destination
            $executable = Join-Path $destination 'opscope.exe'
          } else {
            tar -xzf "dist/$name.tar.gz" -C $destination
            if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed.' }
            $executable = Join-Path $destination 'opscope'
          }
          python tests/cli_smoke.py --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Installed archive regression failed.' }
          "- $($env:RELEASE_RID): archive integrity and extracted executable CLI regressions passed on $hostArchitecture." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  tool:
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RUN_REGRESSIONS: ${{ inputs.run_regressions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and pack the .NET tool without publishing
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 -m unittest discover -s packaging -p 'test_*.py'
          if [[ "$RUN_REGRESSIONS" == 'true' ]]; then
            while IFS= read -r project; do dotnet run --project "$project" -c Release; done < <(find tests -name '*.csproj' -print | sort)
          fi
          dotnet pack src/Opscope/Opscope.csproj -c Release -p:PublishSingleFile=false -p:SelfContained=false -p:PackAsTool=true -p:Version="$RELEASE_VERSION" -p:PackageVersion="$RELEASE_VERSION" -o dist
          python3 -c 'import os,pathlib,xml.etree.ElementTree as E; root=E.Element("configuration"); sources=E.SubElement(root,"packageSources"); E.SubElement(sources,"clear"); E.SubElement(sources,"add",key="local",value=str(pathlib.Path("dist").resolve())); E.ElementTree(root).write(pathlib.Path(os.environ["RUNNER_TEMP"])/"opscope-tool-nuget.config",encoding="utf-8",xml_declaration=True)'
          NUGET_PACKAGES="$RUNNER_TEMP/opscope-tool-cache" dotnet tool install Opscope --tool-path "$RUNNER_TEMP/opscope-tool" --configfile "$RUNNER_TEMP/opscope-tool-nuget.config" --version "$RELEASE_VERSION" --no-cache
          python3 tests/cli_smoke.py --executable "$RUNNER_TEMP/opscope-tool/opscope"
          dotnet tool uninstall Opscope --tool-path "$RUNNER_TEMP/opscope-tool"
          test ! -e "$RUNNER_TEMP/opscope-tool/opscope"
          python3 packaging/release_assets.py sbom --input dist --output tool-sbom/opscope-dotnet-tool.spdx.json --version "$RELEASE_VERSION" --rid dotnet-tool --assets src/Opscope/obj/project.assets.json
          cp tool-sbom/opscope-dotnet-tool.spdx.json dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-tool
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [binaries, tool]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-tool
          path: dist
      - name: Assemble and verify all distribution assets without publishing
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 packaging/release_assets.py manifests --input dist --output dist/manifests --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
          python3 packaging/release_assets.py archive --input dist/manifests --output "dist/opscope-$RELEASE_VERSION-package-manifests.tar.gz"
          python3 packaging/release_assets.py checksums --input dist --output dist/SHA256SUMS
          python3 packaging/release_assets.py verify --input dist --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14
