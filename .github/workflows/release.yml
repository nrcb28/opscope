name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v (must match an existing tag to create a draft release)'
        required: true
        type: string
      create_draft:
        description: 'Create or update a draft GitHub release after building'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "\A$number\.$number\.$number(-$identifier(\.$identifier)*)?\z") { throw 'A concrete semantic version is required.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:CREATE_DRAFT -eq 'true') {
            $tagCommit = git rev-parse "refs/tags/v$version^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) { throw 'Draft creation requires an existing version tag at the selected commit.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  packages:
    needs: version
    uses: ./.github/workflows/package-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      run_regressions: true
      native_signing: true
    secrets:
      OPSCOPE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.OPSCOPE_WINDOWS_CERTIFICATE_BASE64 }}
      OPSCOPE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.OPSCOPE_WINDOWS_CERTIFICATE_PASSWORD }}
      OPSCOPE_MACOS_CERTIFICATE_BASE64: ${{ secrets.OPSCOPE_MACOS_CERTIFICATE_BASE64 }}
      OPSCOPE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.OPSCOPE_MACOS_CERTIFICATE_PASSWORD }}
      OPSCOPE_MACOS_SIGN_IDENTITY: ${{ secrets.OPSCOPE_MACOS_SIGN_IDENTITY }}

  assemble:
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-assets
          path: dist
      - name: Optionally sign the checksum manifest with a configured private key
        env:
          SIGNING_KEY: ${{ secrets.OPSCOPE_RELEASE_SIGNING_KEY_PEM }}
          SIGNING_KEY_PASSWORD: ${{ secrets.OPSCOPE_RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEY" ]]; then
            keyfile="$RUNNER_TEMP/opscope-signing-key.pem"
            trap 'rm -f "$keyfile"' EXIT
            umask 077
            printf '%s' "$SIGNING_KEY" > "$keyfile"
            openssl pkey -in "$keyfile" -passin env:SIGNING_KEY_PASSWORD -pubout -out dist/release-signing-public.pem
            python3 packaging/release_assets.py checksums --input dist --output dist/SHA256SUMS
            openssl dgst -sha256 -sign "$keyfile" -passin env:SIGNING_KEY_PASSWORD -out dist/SHA256SUMS.sig dist/SHA256SUMS
            openssl dgst -sha256 -verify dist/release-signing-public.pem -signature dist/SHA256SUMS.sig dist/SHA256SUMS
          else
            python3 packaging/release_assets.py checksums --input dist --output dist/SHA256SUMS
            echo 'Detached checksum signature skipped: no signing key configured.'
          fi
      - name: Verify the final distribution after optional checksum signing
        run: python3 packaging/release_assets.py verify --input dist --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Attest release artifact provenance
        # EN: Existing-file hashes are attested; registry upload is disabled and publishing remains separate.
        # ES: Se atestiguan hashes de archivos existentes; no se suben al registro y la publicación sigue separada.
        if: github.event.repository.private == false || vars.OPSCOPE_ENABLE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.nupkg
            dist/*.spdx.json
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [version, assemble]
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create a reviewable draft release; never submit package-manager manifests
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          cat > "$RUNNER_TEMP/opscope-release-notes.md" <<'EOF'
          Self-contained archives, a .NET tool package, SPDX SBOMs, SHA256SUMS and package-manager manifests are attached. Native signatures are present only when real signing certificates were configured. See docs/delivery.md for verification and remaining publication steps.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = 'true'
          else
            gh release create "$tag" --verify-tag --draft --title "Opscope $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/opscope-release-notes.md"
          fi
          find dist -type f -not -path '*/manifests/*' -print0 | xargs -0 gh release upload "$tag" --clobber
