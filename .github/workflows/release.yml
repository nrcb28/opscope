name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v (must match an existing tag to create a draft release)'
        required: true
        type: string
      create_draft:
        description: 'Create or update a draft GitHub release after building'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "\A$number\.$number\.$number(-$identifier(\.$identifier)*)?\z") { throw 'A concrete semantic version is required.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:CREATE_DRAFT -eq 'true') {
            $tagCommit = git rev-parse "refs/tags/v$version^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) { throw 'Draft creation requires an existing version tag at the selected commit.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: osx-x64, os: macos-14 }
          - { rid: osx-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish self-contained binary
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          "SOURCE_DATE_EPOCH=$env:SOURCE_DATE_EPOCH" >> $env:GITHUB_ENV
          dotnet publish src/Opscope/Opscope.csproj -c Release -r $env:RELEASE_RID --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$env:RELEASE_VERSION" -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          Copy-Item LICENSE,README.md publish/
      - name: Sign Windows binary when a real certificate is configured
        if: runner.os == 'Windows'
        env:
          CERTIFICATE_BASE64: ${{ secrets.OPSCOPE_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.OPSCOPE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { Write-Output 'Authenticode signing skipped: no certificate configured.'; exit 0 }
          $certificateFile = Join-Path $env:RUNNER_TEMP 'opscope-signing.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = if ($env:CERTIFICATE_PASSWORD) { ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force } else { New-Object Security.SecureString }
            $certificate = Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'Configured certificate contains no private key.' }
            $signature = Set-AuthenticodeSignature -FilePath publish/opscope.exe -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer https://timestamp.digicert.com
            if ($signature.Status -ne 'Valid') { throw 'Authenticode validation failed.' }
          } finally {
            Remove-Item $certificateFile -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }
      - name: Sign macOS binary when a real Developer ID is configured
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.OPSCOPE_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.OPSCOPE_MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.OPSCOPE_MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" ]]; then echo 'Developer ID signing skipped: no certificate configured.'; exit 0; fi
          test -n "$SIGN_IDENTITY"
          umask 077
          keychain="$RUNNER_TEMP/opscope-signing.keychain-db"
          certificate="$RUNNER_TEMP/opscope-signing.p12"
          keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          python3 -c 'import os,base64; from pathlib import Path; Path(os.environ["RUNNER_TEMP"],"opscope-signing.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_BASE64"],validate=True))'
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          find publish -name '*.dylib' -exec codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$SIGN_IDENTITY" '{}' \;
          codesign --force --options runtime --timestamp --entitlements packaging/macos-entitlements.plist --keychain "$keychain" --sign "$SIGN_IDENTITY" publish/opscope
          codesign --verify --strict publish/opscope
      - name: Create archive and SPDX SBOM from actual output
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $extension = if ($env:RELEASE_RID.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          $name = "opscope-$env:RELEASE_VERSION-$env:RELEASE_RID"
          python packaging/release_assets.py archive --input publish --output "dist/$name.$extension"
          if ($LASTEXITCODE -ne 0) { throw 'Archive generation failed.' }
          python packaging/release_assets.py sbom --input publish --output "dist/$name.spdx.json" --version $env:RELEASE_VERSION --rid $env:RELEASE_RID --assets src/Opscope/obj/project.assets.json
          if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  tool:
    needs: version
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426
      - name: Test and pack the .NET tool without publishing
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 -m unittest discover -s packaging -p 'test_*.py'
          while IFS= read -r project; do dotnet run --project "$project" -c Release; done < <(find tests -name '*.csproj' -print | sort)
          dotnet pack src/Opscope/Opscope.csproj -c Release -p:PublishSingleFile=false -p:SelfContained=false -p:PackAsTool=true -p:Version="$RELEASE_VERSION" -p:PackageVersion="$RELEASE_VERSION" -o dist
          dotnet tool install Opscope --tool-path "$RUNNER_TEMP/opscope-tool" --add-source "$PWD/dist" --version "$RELEASE_VERSION" --ignore-failed-sources
          "$RUNNER_TEMP/opscope-tool/opscope" --help
          python3 packaging/release_assets.py sbom --input dist --output tool-sbom/opscope-dotnet-tool.spdx.json --version "$RELEASE_VERSION" --rid dotnet-tool --assets src/Opscope/obj/project.assets.json
          cp tool-sbom/opscope-dotnet-tool.spdx.json dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-tool
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: [version, binaries, tool]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate winget and Homebrew manifests using real archive hashes
        run: |
          set -euo pipefail
          python3 packaging/release_assets.py manifests --input dist --output dist/manifests --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
          python3 packaging/release_assets.py archive --input dist/manifests --output "dist/opscope-$RELEASE_VERSION-package-manifests.tar.gz"
      - name: Optionally sign the checksum manifest with a configured private key
        env:
          SIGNING_KEY: ${{ secrets.OPSCOPE_RELEASE_SIGNING_KEY_PEM }}
          SIGNING_KEY_PASSWORD: ${{ secrets.OPSCOPE_RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEY" ]]; then
            keyfile="$RUNNER_TEMP/opscope-signing-key.pem"
            trap 'rm -f "$keyfile"' EXIT
            umask 077
            printf '%s' "$SIGNING_KEY" > "$keyfile"
            openssl pkey -in "$keyfile" -passin env:SIGNING_KEY_PASSWORD -pubout -out dist/release-signing-public.pem
            python3 packaging/release_assets.py checksums --input dist --output dist/SHA256SUMS
            openssl dgst -sha256 -sign "$keyfile" -passin env:SIGNING_KEY_PASSWORD -out dist/SHA256SUMS.sig dist/SHA256SUMS
            openssl dgst -sha256 -verify dist/release-signing-public.pem -signature dist/SHA256SUMS.sig dist/SHA256SUMS
          else
            python3 packaging/release_assets.py checksums --input dist --output dist/SHA256SUMS
            echo 'Detached checksum signature skipped: no signing key configured.'
          fi
      - name: Attest release artifact provenance
        # EN: Existing-file hashes are attested; registry upload is disabled and publishing remains separate.
        # ES: Se atestiguan hashes de archivos existentes; no se suben al registro y la publicación sigue separada.
        if: github.event.repository.private == false || vars.OPSCOPE_ENABLE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.nupkg
            dist/*.spdx.json
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  draft:
    needs: [version, assemble]
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create a reviewable draft release; never submit package-manager manifests
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          cat > "$RUNNER_TEMP/opscope-release-notes.md" <<'EOF'
          Self-contained archives, a .NET tool package, SPDX SBOMs, SHA256SUMS and package-manager manifests are attached. Native signatures are present only when real signing certificates were configured. See docs/delivery.md for verification and remaining publication steps.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = 'true'
          else
            gh release create "$tag" --verify-tag --draft --title "Opscope $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/opscope-release-notes.md"
          fi
          find dist -type f -not -path '*/manifests/*' -print0 | xargs -0 gh release upload "$tag" --clobber
