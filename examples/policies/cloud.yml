version: 1
# Only cloud rules run against AnalysisReport; local thresholds are not applied.
rules:
  - id: cloud-resource-budget
    metric: cloud.resourceCount
    operator: ">"
    value: 200
    severity: warning
    title: Cloud resource budget exceeded
    recommendation: Review the scoped normalized inventory and approved capacity.
  - id: cloud-critical-findings
    metric: cloud.criticalCount
    operator: ">"
    value: 0
    severity: critical
    title: Critical cloud findings require review
    recommendation: Review the provider evidence before approving remediation.
  - id: cloud-warning-findings
    metric: cloud.warningCount
    operator: ">"
    value: 10
    severity: warning
    title: Cloud warning budget exceeded
    recommendation: Review the scoped provider findings and coverage warnings.
